name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.22.1'
          - '24'
          - '26'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run validation suite
        run: xvfb-run -a npm run validate
